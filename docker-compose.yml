services:
  codex:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-rocky:9

    stdin_open: true
    tty: true
    working_dir: /workspace
    network_mode: ${CODEX_NETWORK_MODE:-bridge}

    # Codex uses Bubblewrap for its workspace sandbox. Docker's default seccomp
    # profile blocks the unprivileged user/mount namespace operations Bubblewrap
    # requires, causing sandboxed commands to fail and fall back to approval prompts.
    # This disables Docker's syscall filtering but retains the other container
    # isolation mechanisms while allowing Codex's own sandbox to function.
    security_opt:
      - seccomp=unconfined

    environment:
      - PAGER=less
      - CODEX_USER_ID=${CODEX_USER_ID:-1000}
      - CODEX_GROUP_ID=${CODEX_GROUP_ID:-1000}

    volumes:
      # Repository being worked on.
      - "${CODEX_HOST_DIR}/codex-repos/${REPO}:/workspace"

      # Workbench instructions shared by every repository. Disabling automatic
      # host-path creation avoids a root-owned path if the source is missing.
      - type: bind
        source: ./AGENTS.md
        target: /workspace/AGENTS.md
        read_only: true
        bind:
          create_host_path: false

      # All Codex runtime/session state is repository-specific.
      - "${CODEX_HOST_DIR}/codex-state/repos/${REPO}/codex:/home/codex/.codex"

      # Shared Codex identity and configuration.
      - "${CODEX_HOST_DIR}/codex-state/shared:/home/codex/.codex-shared"

      # Shared Git/SSH identity.
      - "${CODEX_HOST_DIR}/codex-state/shared/.ssh:/home/codex/.ssh:ro"
      - "${CODEX_HOST_DIR}/codex-state/shared/.gitconfig:/home/codex/.gitconfig:ro"
